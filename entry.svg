<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" font-family="Helvetica, Arial, sans-serif">
<rect width="1024" height="1024" fill="#eef1f6"/>
<rect x="24" y="0" width="976" height="1024" fill="#ffffff"/>
<rect x="24" y="0" width="976" height="92" fill="#101620"/>
<text x="34" y="24" font-family="Georgia, serif" font-size="9.5" letter-spacing="2.6" fill="#7f8ea6">THE WORLD'S NEWS IN ONE IMAGE</text>
<text x="34" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#ffffff">TUESDAY, 24 NOVEMBER 2026</text>
<text x="34" y="77" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9fb0c8">Ten stories from one day, across business, war, law, climate, science and sport</text>
<g transform="translate(866 12)" fill="none" stroke="#3f4c60" stroke-width="1.8">
<circle cx="52" cy="20" r="12"/><ellipse cx="52" cy="20" rx="5" ry="12"/><path d="M40 20h24"/>
<path d="M14 46h76" stroke="#3f4c60" stroke-width="1"/>
<text x="14" y="63" font-family="Georgia, serif" font-size="9" letter-spacing="1.6" fill="#7f8ea6" stroke="none">ONE DAY</text>
</g>
<g transform="translate(34 92)">
  <g>
    <rect x="34" y="0" width="470" height="165" rx="7" fill="#ffffff" stroke="#d5d9e0" stroke-width="1.2"/>
    <rect x="34" y="0" width="5" height="165" rx="2.5" fill="#2563eb"/>
    <g transform="translate(48 10) scale(0.53125)" fill="none" stroke="#2563eb" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="16" height="16" rx="2"/><rect x="13" y="13" width="6" height="6" rx="1"/><path d="M12 4v4M20 4v4M12 24v4M20 24v4M4 12h4M4 20h4M24 12h4M24 20h4"/></g>
    <text x="72" y="24" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#2563eb">UNITED STATES</text>
    <text x="488" y="24" text-anchor="end" font-family="Georgia, serif" font-size="10" font-weight="700" fill="#a8b0bd">1</text>
    <text x="49" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#14181f">Nvidia reinstates Jensen</text><text x="49" y="73" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#14181f">Huang as CEO</text>
    <text x="49" y="106" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4a5261">The board reverses itself after Trump pressed for</text><text x="49" y="122" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4a5261">it. Shares jump 31.5%, adding more than $1.5</text><text x="49" y="138" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4a5261">trillion in value.</text>
  </g>
  <g>
    <rect x="520" y="0" width="470" height="165" rx="7" fill="#ffffff" stroke="#d5d9e0" stroke-width="1.2"/>
    <rect x="520" y="0" width="5" height="165" rx="2.5" fill="#dc2626"/>
    <g transform="translate(534 10) scale(0.53125)" fill="none" stroke="#dc2626" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h20l3 4v4H3z"/><rect x="6" y="11" width="12" height="9" rx="1"/><path d="M18 13h5v7"/><path d="M2 28c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2 2 2 4 2"/></g>
    <text x="558" y="24" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#dc2626">STRAIT OF HORMUZ</text>
    <text x="974" y="24" text-anchor="end" font-family="Georgia, serif" font-size="10" font-weight="700" fill="#a8b0bd">2</text>
    <text x="535" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#14181f">Three oil tankers hit mines</text><text x="535" y="73" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#14181f">and catch fire</text>
    <text x="535" y="106" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4a5261">Iran says it will use "all available means"</text><text x="535" y="122" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4a5261">against a US naval blockade, and will not talk</text><text x="535" y="138" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4a5261">until seven conditions are met.</text>
  </g>
  <g>
    <rect x="34" y="174" width="470" height="149" rx="7" fill="#ffffff" stroke="#d5d9e0" stroke-width="1.2"/>
    <rect x="34" y="174" width="5" height="149" rx="2.5" fill="#b45309"/>
    <g transform="translate(48 184) scale(0.53125)" fill="none" stroke="#b45309" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3l3.2 7.4 8-1.3-5.4 6 5.4 6-8-1.3L16 27l-3.2-7.2-8 1.3 5.4-6-5.4-6 8 1.3z"/></g>
    <text x="72" y="198" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#b45309">GAZA</text>
    <text x="488" y="198" text-anchor="end" font-family="Georgia, serif" font-size="10" font-weight="700" fill="#a8b0bd">3</text>
    <text x="49" y="222" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#14181f">Israeli strikes kill at</text><text x="49" y="247" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#14181f">least eight in Gaza</text>
    <text x="49" y="280" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4a5261">Three separate strikes, one on a police station in</text><text x="49" y="296" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4a5261">Khan Younis. A UNRWA worker is among the dead.</text>
  </g>
  <g>
    <rect x="520" y="174" width="470" height="149" rx="7" fill="#ffffff" stroke="#d5d9e0" stroke-width="1.2"/>
    <rect x="520" y="174" width="5" height="149" rx="2.5" fill="#7c3aed"/>
    <g transform="translate(534 184) scale(0.53125)" fill="none" stroke="#7c3aed" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="16" r="5"/><path d="M6 6l6 6M26 6l-6 6M6 26l6-6M26 26l-6-6"/><circle cx="5" cy="5" r="3"/><circle cx="27" cy="5" r="3"/><circle cx="5" cy="27" r="3"/><circle cx="27" cy="27" r="3"/></g>
    <text x="558" y="198" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#7c3aed">UKRAINE</text>
    <text x="974" y="198" text-anchor="end" font-family="Georgia, serif" font-size="10" font-weight="700" fill="#a8b0bd">4</text>
    <text x="535" y="222" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#14181f">Ukrainian sea drones hit a</text><text x="535" y="247" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#14181f">Russian warship in Libya</text>
    <text x="535" y="280" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4a5261">Kyiv says it sank a frigate, hit a helicopter and</text><text x="535" y="296" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4a5261">struck an arms cargo ship at Benghazi.</text>
  </g>
  <g>
    <rect x="34" y="332" width="470" height="165" rx="7" fill="#ffffff" stroke="#d5d9e0" stroke-width="1.2"/>
    <rect x="34" y="332" width="5" height="165" rx="2.5" fill="#0f766e"/>
    <g transform="translate(48 342) scale(0.53125)" fill="none" stroke="#0f766e" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="16" r="4"/><g id="st"><path d="M16 3v3M16 26v3M3 16h3M26 16h3M6.8 6.8l2.1 2.1M23.1 23.1l2.1 2.1M25.2 6.8l-2.1 2.1M8.9 23.1l-2.1 2.1"/></g><circle cx="16" cy="5" r="1.6"/><circle cx="16" cy="27" r="1.6"/><circle cx="5" cy="16" r="1.6"/><circle cx="27" cy="16" r="1.6"/></g>
    <text x="72" y="356" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#0f766e">EUROPEAN UNION</text>
    <text x="488" y="356" text-anchor="end" font-family="Georgia, serif" font-size="10" font-weight="700" fill="#a8b0bd">5</text>
    <text x="49" y="380" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#14181f">22nd sanctions package on</text><text x="49" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#14181f">Russia</text>
    <text x="49" y="438" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4a5261">About 60 Russian banks and more than 70 vessels</text><text x="49" y="454" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4a5261">targeted, with bans on Russian athletes and</text><text x="49" y="470" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4a5261">ex-combatant visas.</text>
  </g>
  <g>
    <rect x="520" y="332" width="470" height="165" rx="7" fill="#ffffff" stroke="#d5d9e0" stroke-width="1.2"/>
    <rect x="520" y="332" width="5" height="165" rx="2.5" fill="#15803d"/>
    <g transform="translate(534 342) scale(0.53125)" fill="none" stroke="#15803d" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="16" r="12"/><ellipse cx="16" cy="16" rx="5" ry="12"/><path d="M4 16h24"/></g>
    <text x="558" y="356" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#15803d">CLIMATE</text>
    <text x="974" y="356" text-anchor="end" font-family="Georgia, serif" font-size="10" font-weight="700" fill="#a8b0bd">6</text>
    <text x="535" y="380" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#14181f">COP31 ends in Antalya with</text><text x="535" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#14181f">no agreement</text>
    <text x="535" y="438" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4a5261">The first UN climate summit to fail in 17 years,</text><text x="535" y="454" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4a5261">after two weeks of talks. Parties trade blame.</text>
  </g>
  <g>
    <rect x="34" y="506" width="470" height="165" rx="7" fill="#ffffff" stroke="#d5d9e0" stroke-width="1.2"/>
    <rect x="34" y="506" width="5" height="165" rx="2.5" fill="#0e7490"/>
    <g transform="translate(48 516) scale(0.53125)" fill="none" stroke="#0e7490" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M16 5v22M8 27h16"/><path d="M16 8l-9 3M16 8l9 3"/><path d="M7 11l-4 8h8zM25 11l-4 8h8z"/></g>
    <text x="72" y="530" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#0e7490">THE WORLD COURT</text>
    <text x="488" y="530" text-anchor="end" font-family="Georgia, serif" font-size="10" font-weight="700" fill="#a8b0bd">7</text>
    <text x="49" y="554" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#14181f">ICJ rules Myanmar guilty of</text><text x="49" y="579" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#14181f">genocide</text>
    <text x="49" y="612" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4a5261">The ruling on the Rohingya came as Malaysia said</text><text x="49" y="628" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4a5261">it would return thousands of migrants to Myanmar.</text>
  </g>
  <g>
    <rect x="520" y="506" width="470" height="165" rx="7" fill="#ffffff" stroke="#d5d9e0" stroke-width="1.2"/>
    <rect x="520" y="506" width="5" height="165" rx="2.5" fill="#ca8a04"/>
    <g transform="translate(534 516) scale(0.53125)" fill="none" stroke="#ca8a04" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 26V6M4 26h24"/><path d="M7 22l5-7 5 4 8-11"/></g>
    <text x="558" y="530" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#ca8a04">MARKETS</text>
    <text x="974" y="530" text-anchor="end" font-family="Georgia, serif" font-size="10" font-weight="700" fill="#a8b0bd">8</text>
    <text x="535" y="554" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#14181f">Wall Street roars back:</text><text x="535" y="579" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#14181f">Nasdaq +6.5%</text>
    <text x="535" y="612" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4a5261">S&amp;P 500 +4.7% to 7,237 and Dow +3.0%. The dollar</text><text x="535" y="628" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4a5261">index hit a 20-month high; oil fell to a</text><text x="535" y="644" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4a5261">three-month low.</text>
  </g>
  <g>
    <rect x="34" y="680" width="470" height="148" rx="7" fill="#ffffff" stroke="#d5d9e0" stroke-width="1.2"/>
    <rect x="34" y="680" width="5" height="148" rx="2.5" fill="#4338ca"/>
    <g transform="translate(48 690) scale(0.53125)" fill="none" stroke="#4338ca" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="16" r="5"/><ellipse cx="16" cy="16" rx="13" ry="5" transform="rotate(-24 16 16)"/><path d="M25 7l2-2M5 25l-2 2"/></g>
    <text x="72" y="704" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#4338ca">SCIENCE</text>
    <text x="488" y="704" text-anchor="end" font-family="Georgia, serif" font-size="10" font-weight="700" fill="#a8b0bd">9</text>
    <text x="49" y="728" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" fill="#14181f">Euclid finds the most</text><text x="49" y="753" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" fill="#14181f">distant quasar yet</text>
    <text x="49" y="786" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#4a5261">A 360-million-sun-mass core seen just 630</text><text x="49" y="801.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#4a5261">million years after the Big Bang.</text>
  </g>
  <g>
    <rect x="520" y="680" width="470" height="148" rx="7" fill="#ffffff" stroke="#d5d9e0" stroke-width="1.2"/>
    <rect x="520" y="680" width="5" height="148" rx="2.5" fill="#be123c"/>
    <g transform="translate(534 690) scale(0.53125)" fill="none" stroke="#be123c" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M27 16a11 11 0 1 1-4-8.4"/><path d="M27 4v6h-6"/></g>
    <text x="558" y="704" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#be123c">BANGLADESH</text>
    <text x="974" y="704" text-anchor="end" font-family="Georgia, serif" font-size="10" font-weight="700" fill="#a8b0bd">10</text>
    <text x="535" y="728" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" fill="#14181f">Hasina says she returns</text><text x="535" y="753" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" fill="#14181f">home on 16 December</text>
    <text x="535" y="786" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#4a5261">After more than two years in exile; the foreign</text><text x="535" y="801.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#4a5261">minister says she must come back in handcuffs.</text>
  </g><rect x="34" y="833" width="956" height="50" rx="7" fill="#f2f4f8" stroke="#d5d9e0" stroke-width="1.2"/><g transform="translate(46 844) scale(0.5625)" fill="none" stroke="#0891b2" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3c5 4 7 9 7 14l-4 5h-6l-4-5c0-5 2-10 7-14z"/><circle cx="16" cy="12" r="2.6"/><path d="M9 17l-4 3 1 5 5-2M23 17l4 3-1 5-5-2"/></g><text x="71" y="851" font-family="Georgia, serif" font-size="9" font-weight="700" letter-spacing="1.2" fill="#0891b2">ASIA-PACIFIC</text><text x="71" y="863" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#4a5261">A Pakistani astronaut to fly on</text><text x="71" y="873.5" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#4a5261">China's Shenzhou-24, the first</text><text x="71" y="884" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#4a5261">foreigner aboard a Chinese</text><g transform="translate(356.6666666666667 844) scale(0.5625)" fill="none" stroke="#0d9488" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20c3-3 6 3 9 0s6 3 9 0 6 3 8 0"/><path d="M3 26c3-3 6 3 9 0s6 3 9 0 6 3 8 0"/><path d="M12 16l4-9 4 9z"/></g><text x="381.6666666666667" y="851" font-family="Georgia, serif" font-size="9" font-weight="700" letter-spacing="1.2" fill="#0d9488">LATIN AMERICA</text><text x="381.6666666666667" y="863" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#4a5261">Severe flooding hits the</text><text x="381.6666666666667" y="873.5" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#4a5261">Galapagos Islands amid El Nino</text><text x="381.6666666666667" y="884" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#4a5261">concerns</text><g transform="translate(667.3333333333334 844) scale(0.5625)" fill="none" stroke="#a16207" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3c5 5 7 8 7 13a7 7 0 1 1-14 0c0-3 2-5 4-7 0 3 1 4 2 4 1-3 0-7 1-10z"/></g><text x="692.3333333333334" y="851" font-family="Georgia, serif" font-size="9" font-weight="700" letter-spacing="1.2" fill="#a16207">AFRICA</text><text x="692.3333333333334" y="863" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#4a5261">Flames engulf beachfront hotels</text><text x="692.3333333333334" y="873.5" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#4a5261">in Zanzibar as workers are</text><text x="692.3333333333334" y="884" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#4a5261">trapped at an Indonesian factory</text><line x1="34" y1="908" x2="990" y2="908" stroke="#c9cfd8" stroke-width="1"/><text x="34" y="924" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#7c8595">Compiled from reports filed on 24 November 2026 by Reuters, AP, AFP, the UN, ESA and public broadcasters.</text></g>
</svg>